project:
  id: cross-backend-demo
  title: Three numeric ontologies, one formulation, three answers
  language: en

# Addendum stage C, acceptance section 18.3: compare float64 / Decimal / Rational,
# produce a difference matrix, and distinguish EXACT agreement from agreement
# within a tolerance.
#
# Note the quoted point values. A bare 0.1 in YAML is already a float64 before any
# backend sees it, so the analysis would be comparing three ontologies' opinions
# of an already-rounded number. The loader refuses an unquoted float here for
# exactly that reason.

numeric_policy:
  default_backend: rational
  source_parsing: exact_string
  certification:
    mode: cross_backend

parameters:
  t:
    type: float
    range: [0.0, 1.0]
    samples: 3

claims:
  - id: sum_then_subtract_is_zero
    statement: (a + b) - c is zero when a + b equals c
    expression: 1 > 0
    status: hypothesis
    required_checks:
      - numerical

analyses:
  - id: classic_float_residue
    type: cross_backend
    title: (a + b) - c, where a + b is exactly c
    claim_id: sum_then_subtract_is_zero
    expression: (a + b) - c
    backends: [float64, decimal, rational]
    tolerance: 0.0
    points:
      - {a: "0.1", b: "0.2", c: "0.3"}
      - {a: "0.7", b: "0.1", c: "0.8"}
      - {a: "1/3", b: "2/3", c: "1"}

  - id: same_thing_within_tolerance
    type: cross_backend
    title: The same comparison, with a tolerance — a weaker claim, reported as one
    claim_id: sum_then_subtract_is_zero
    expression: (a + b) - c
    backends: [float64, decimal, rational]
    tolerance: 1e-12
    points:
      - {a: "0.1", b: "0.2", c: "0.3"}
