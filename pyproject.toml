[build-system]
requires = ["hatchling>=1.25", "editables>=0.3"]
build-backend = "hatchling.build"

[project]
name = "felra"
version = "1.5.0"
description = "Python-first academic verification and visualization workbench for FELRA"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Neo.K"}]
dependencies = [
  "matplotlib>=3.8",
  "mpmath>=1.3",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "sympy>=1.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "jsonschema>=4.22",
]

[project.scripts]
felra = "felra.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/felra"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
